<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title></title>
<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  min-height: 100%;
  background: #000;
}
body {
  padding: 24px;
}
.gallery {
  columns: 4;
  column-gap: 18px;
  max-width: 1500px;
  margin: auto;
}
.photo {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto 18px;
  break-inside: avoid;
  background: #000;
}
/* Different widths create a scattered photo-wall effect */
.photo:nth-child(3n) {
  width: 82%;
}
.photo:nth-child(4n) {
  width: 92%;
}
.photo:nth-child(5n) {
  width: 72%;
}
@media (max-width: 700px) {
  body {
    padding: 14px;
  }
  .gallery {
    columns: 2;
    column-gap: 12px;
  }
  .photo {
    margin-bottom: 12px;
  }
}
</style>
</head>
<body>
<main class="gallery">
<img class="photo" src="000_0004%202.jpeg" alt="">
<img class="photo" src="102_8057.jpeg" alt="">
<img class="photo" src="102_8064.jpeg" alt="">
<img class="photo" src="102_8076%202.jpeg" alt="">
<img class="photo" src="CNV00012%20-1.jpeg" alt="">
<img class="photo" src="IMG_0602.jpeg" alt="">
<img class="photo" src="IMG_3270.jpeg" alt="">
<img class="photo" src="IMG_9344.jpeg" alt="">
<img class="photo" src="IMG_9897.jpeg" alt="">
<img class="photo" src="img00.jpeg" alt="">
</main>
</body>
</html>
