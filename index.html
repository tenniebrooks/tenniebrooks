<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Tennie Brooks Photography</title>
<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  min-height: 100%;
  background: #000;
}
body {
  padding: 24px;
}
/* Black wall gallery */
.gallery {
  columns: 4;
  column-gap: 18px;
  max-width: 1500px;
  margin: 0 auto;
}
.photo {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto 18px;
  break-inside: avoid;
  background: #000;
  cursor: zoom-in;
}
/* Varied photo sizes */
.photo:nth-child(3n) {
  width: 82%;
}
.photo:nth-child(4n) {
  width: 92%;
}
.photo:nth-child(5n) {
  width: 72%;
}
/* Mobile layout */
@media (max-width: 700px) {
  body {
    padding: 14px;
  }
  .gallery {
    columns: 2;
    column-gap: 12px;
  }
  .photo {
    margin-bottom: 12px;
  }
}
/* Full-screen photo preview */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #000;
  align-items: center;
  justify-content: center;
  padding: 50px 12px 20px;
}
.lightbox.open {
  display: flex;
}
.lightbox img {
  display: block;
  max-width: 100%;
  max-height: 90vh;
  width: auto;
  height: auto;
  object-fit: contain;
}
.close {
  position: absolute;
  top: 10px;
  right: 18px;
  color: #fff;
  font-size: 38px;
  line-height: 1;
  cursor: pointer;
  background: none;
  border: none;
  padding: 8px;
}
</style>
</head>
<body>
<main class="gallery">
  <img class="photo" src="000_0004%202.jpeg" alt="Concert photograph" loading="eager">
  <img class="photo" src="102_8057.jpeg" alt="Concert photograph" loading="eager">
  <img class="photo" src="102_8064.jpeg" alt="Concert photograph" loading="lazy">
  <img class="photo" src="102_8076%202.jpeg" alt="Concert photograph" loading="lazy">
  <img class="photo" src="CNV00012%20-1.jpeg" alt="Concert photograph" loading="lazy">
  <img class="photo" src="IMG_0602.jpeg" alt="Concert photograph" loading="lazy">
  <img class="photo" src="IMG_3270.jpeg" alt="Concert photograph" loading="lazy">
  <img class="photo" src="IMG_9344.jpeg" alt="Concert photograph" loading="lazy">
  <img class="photo" src="IMG_9897.jpeg" alt="Concert photograph" loading="lazy">
  <img class="photo" src="img00.jpeg" alt="Concert photograph" loading="lazy">
</main>
<!-- Enlarged photo viewer -->
<div class="lightbox" id="lightbox" role="dialog"
     aria-modal="true" aria-label="Enlarged photograph">
  <button class="close" id="close" aria-label="Close preview">&times;</button>
  <img id="enlarged" src="" alt="Enlarged concert photograph">
</div>
<script>
const lightbox = document.getElementById('lightbox');
const enlarged = document.getElementById('enlarged');
document.querySelectorAll('.photo').forEach(photo => {
  photo.addEventListener('click', () => {
    enlarged.src = photo.src;
    enlarged.alt = photo.alt;
    lightbox.classList.add('open');
  });
});
function closePreview() {
  lightbox.classList.remove('open');
  enlarged.src = '';
}
document.getElementById('close').addEventListener('click', closePreview);
lightbox.addEventListener('click', event => {
  if (event.target === lightbox) {
    closePreview();
  }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    closePreview();
  }
});
</script>
</body>
</html>
