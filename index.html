<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title></title>
<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  min-height: 100%;
  background: #000;
}
body {
  padding: 24px;
}
.gallery {
  columns: 4;
  column-gap: 14px;
  max-width: 1500px;
  margin: 0 auto;
}
.photo {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto 14px;
  break-inside: avoid;
  background: #000;
}
/* Vary the photo sizes to create a scattered wall */
.photo:nth-child(3n) {
  width: 82%;
}
.photo:nth-child(4n) {
  width: 92%;
}
.photo:nth-child(5n) {
  width: 72%;
}
@media (max-width: 700px) {
  body {
    padding: 14px;
  }
  .gallery {
    columns: 2;
    column-gap: 10px;
  }
  .photo {
    margin-bottom: 10px;
  }
}
</style>
</head>
<body>
<main class="gallery">
<img class="photo" src="photo-01.jpg" alt="">
<img class="photo" src="photo-02.jpg" alt="">
<img class="photo" src="photo-03.jpg" alt="">
<img class="photo" src="photo-04.jpg" alt="">
<img class="photo" src="photo-05.jpg" alt="">
<img class="photo" src="photo-06.jpg" alt="">
</main>
</body>
</html>
