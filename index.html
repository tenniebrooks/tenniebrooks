<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title></title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000}
body{padding:3px;background:#000}
.gallery{columns:3;column-gap:3px;width:100%;}
.photo{display:block;width:100%;height:auto;margin:0 0 3px;break-inside:avoid;page-break-inside:avoid;object-fit:contain;background:#000;}
@media(max-width:700px){body{padding:2px}.gallery{columns:2;column-gap:3px}.photo{margin-bottom:3px}}
</style>
</head>
<body>
<main class="gallery">
<!-- Add your photos to this folder and name them photo-01.jpg, photo-02.jpg, etc. -->
<img class="photo" src="photo-01.jpg" alt="">
<img class="photo" src="photo-02.jpg" alt="">
<img class="photo" src="photo-03.jpg" alt="">
<img class="photo" src="photo-04.jpg" alt="">
<img class="photo" src="photo-05.jpg" alt="">
<img class="photo" src="photo-06.jpg" alt="">
</main>
</body>
</html>
